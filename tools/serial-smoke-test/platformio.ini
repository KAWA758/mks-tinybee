[platformio]
default_envs = tinybee_serial_test

[env:tinybee_serial_test]
platform = espressif32@2.1.0
board = esp32dev
framework = arduino
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
upload_protocol = esptool
upload_speed = 115200
monitor_speed = 115200
extra_scripts = post:../tinybee_upload.py
